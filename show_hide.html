<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- JQuery -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script> 
 <!-- <script src="js/jquery.min.js"></script> -->
</head>

</head>
<body>
   <h1>this is heading with h1</h1> 
   
<p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Maiores accusamus dolorem itaque a cumque. Earum doloremque incidunt labore amet quisquam officia asperiores dolorem. In eveniet quam distinctio, aut ab dolor?</p>


<button class="btn1" >hide paragraph</button>
<button class="btn2" >show paragraph</button>


    <!--JQuery  -->
<script>
    $(document).ready(function(){
$(".btn1").click(function(){
    $("p").hide();
});
$(".btn2").click(function(){
    $("p").show();
});


    });
</script>

</body>
</html>
